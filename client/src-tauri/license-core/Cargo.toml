[package]
name = "license-core"
version = "0.2.1"
edition = "2021"
description = "License 校验核心：设备指纹 / Ed25519 验签 / 加密存储 / 时钟回滚检测"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
ed25519-dalek = "2"
aes-gcm = "0.10"
obfstr = "0.4"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
